name: Release to npm

# Push a tag that matches package.json, e.g. `git tag v0.1.0-beta.0 && git push origin v0.1.0-beta.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - run: node test/browser/run.mjs
      - run: VITE_VERSION=7 node scripts/pack-check.mjs
      - run: VITE_VERSION=8 node scripts/pack-check.mjs
      # Every release goes to "latest" so `npm i optiq-image` installs the newest version, betas included.
      # Prereleases are additionally tagged "beta" so `optiq-image@beta` keeps working.
      - name: Publish
        run: |
          npm publish --provenance --access public --tag latest
          case "$VERSION" in *-*) npm dist-tag add "optiq-image@$VERSION" beta ;; esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "Optiq $VERSION" --notes "npm: https://www.npmjs.com/package/optiq-image/v/$VERSION · changes: CHANGELOG.md" $flags
        env:
          GH_TOKEN: ${{ github.token }}
