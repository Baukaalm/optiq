name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: MCP server end-to-end (official MCP client over stdio)
        run: pnpm --filter optiq-mcp test
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - name: Browser tests (Chromium, incl. CSP/no-WASM fallback)
        run: node test/browser/run.mjs
      - name: Demo end-to-end
        run: node test/browser/demo-e2e.mjs
      - name: Documentation site + embedded demo
        run: node scripts/build-site.mjs && node test/browser/site-e2e.mjs
      - name: Package check with Vite 7 (pack, install into a fresh app, build + dev server; does not publish)
        run: VITE_VERSION=7 node scripts/pack-check.mjs
      - name: Package check with Vite 8
        run: VITE_VERSION=8 node scripts/pack-check.mjs
      - name: Browser tests in Firefox and WebKit (Safari engine)
        run: |
          pnpm exec playwright install --with-deps firefox webkit
          BROWSER=firefox node test/browser/run.mjs
          BROWSER=webkit node test/browser/run.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: test-results/*.png
          if-no-files-found: ignore

  # vendor/jpegli is built from pinned sources (codecs/jpegli/build.sh). Rebuild it in the official Emscripten
  # container and check that it encodes byte-identically to the committed module.
  jpegli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: emscripten/emsdk:6.0.13
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ninja-build cmake
      - name: Rebuild jpegli and compare with vendor/jpegli
        run: |
          git config --global --add safe.directory '*'
          JPEGLI_OUT="$RUNNER_TEMP/jpegli" codecs/jpegli/build.sh "$RUNNER_TEMP/jpegli-build"
          "${EMSDK_NODE:-node}" codecs/jpegli/check.mjs "$RUNNER_TEMP/jpegli"
